const ITEMS=[{"id":"B028140AAD","text":"B的爱好是绘画，使用数位板和价格较高的专用绘画软件进行数字创作。过去曾用传统画材，后来转向数字绘画，习惯到觉得难以再回到传统方式。B能说明自己所画的画作类型和使用的画材，曾向A介绍、建议数字绘画软件，得到A的感谢。B认为画画可以打发时间，A也羡慕B会画画。"},{"id":"A012EB24EB","text":"B在多段对话的开头会礼貌地互致问候，在结束时也会向对方表示感谢，例如“こちらこそよろしくお願いします”和“こちらこそありがとうございました”。"},{"id":"A6D8BA54EB","text":"B今年夏天去过仙台，主要目的并非观光，具体目的不明。旅行时遇到台风，但未受损害；期间玩过《我的世界》（Minecraft）。B似乎喜欢或建议过悠闲、不赶行程的旅行方式。"},{"id":"B423DF446E","text":"B似乎经历过2011年东日本大地震，并感受过地震摇晃。推断来自A说自己当时也住在关东、B表示认同；B实际所在地点及受灾程度不明确。"},{"id":"D44FA42EF9","text":"B住在日本关东地区，曾谈及关东天气转冷。部分对话显示B与A住在不同地方，但另一段对话也可能暗示二人在同一地区，存在轻微不一致。"},{"id":"E1CE4D2402","text":"B所在地区有时气温低于15℃；同一周的星期一还很热，之后突然转冷，昼夜温差较大。B可能提到过受凉后肠胃不适。"},{"id":"48CE564B62","text":"B讨论过换季整理衣物的时机，A认为这件事有难度。B还谈到过去人们在统一时间一起换季的做法，但具体表述不明确。"},{"id":"9BE1503384","text":"B提到近年来售卖关东煮的便利店减少，可能还谈到疫情影响了便利店的售卖方式或位置。"},{"id":"3F2A071373","text":"A曾询问B是否准备防灾用品，但B的回答不明确。B谈到台风及储备用品放久后失效的问题；A建议储备容量约10升的储水桶。"},{"id":"F7D895A2E7","text":"B是大学生，正在开展与生物相关的研究，懂得基因、DNA/RNA、分子生物学等内容。研究对象不是贝类，而是与人类的亲缘关系比贝类更近、可能可供食用的生物；A曾表示吃过这种生物。B解释过研究方法，可能就读生物或生命科学相关专业。"},{"id":"5C656B3851","text":"B是大学生，暑假较长，大致从8月持续到9月；假期期间也努力学习，会在学校食堂吃面食，A提到学食面食价格较便宜。"},{"id":"B6F823B7A0","text":"B处于准备升学、临近毕业的阶段，朋友因升学而分散各地。B尚未成为正式工作的社会人士，正在写毕业论文。"},{"id":"4B04D00F44","text":"B计划在今年秋天前往浅草，并称浅草处于行程中两处地点的中间。A曾建议从东京晴空塔城（Soramachi）走到浅草，也就外出摘口罩问题提出意见，显示B可能担心疫情感染风险。"},{"id":"425357938D","text":"B已有一段时间未使用浴缸。天气转冷时，A建议B先认真清洁浴缸，再放热水泡澡。"},{"id":"F10A4E8B34","text":"B爱好游戏，当天打算玩游戏。B表示网络游戏已很普遍，也谈到多人合作类型的游戏。"},{"id":"339C7A68F3","text":"B担心网购衣服时尺码不合适，因此不太会在网上买衣服；即便网上价格便宜，B仍认为购买有风险。"},{"id":"6FFEBC93FD","text":"B在咖啡馆长期兼职，既接待客人，也可能制作饮品、食物，涉及手冲和虹吸壶咖啡。工作已较熟练，需要记住很多菜单项目。B觉得兼顾学业与打工很辛苦，自己的空闲时间不多。"},{"id":"7AC816E4DE","text":"B家中有虹吸式咖啡器具，A认为光是摆在家里就很时尚。B可能用积攒的兼职收入购买，或正在考虑购买，具体情况不明确。"},{"id":"3B42AC2EDD","text":"B没有花粉症（花粉过敏），A对此表示羡慕。"},{"id":"369B039081","text":"B曾谈到冬季运动，但尚不清楚B是否亲自参加或有相关经历。"},{"id":"E481A16637","text":"B最近使用漫画应用阅读漫画，题材多样，看到漫画广告后有时会下载应用继续阅读。B认为电子漫画不占纸质存储空间，也曾因为追看后续剧情而不知不觉花掉很多时间。"},{"id":"915163D54D","text":"B在即将到来的三连休期间需要打工，同时也安排了不少游玩活动。"},{"id":"B7C23A1E2D","text":"B没有汽车，并不认为生活受到明显影响，也不靠开车出行；可能在考虑考驾照。B还提到有些场所凭学生证可以享受优惠，间接支持其学生身份。"},{"id":"6E2FCBCA9F","text":"B需要通学，往返学校可能时间较长，途中有时没有座位。课最多的一段时期恰好在网络授课期间，能够睡懒觉；疫情也曾打乱B的一些计划。"},{"id":"7C6FA7AE53","text":"B对面包与米饭有特定的吃法或偏好，曾被A称赞为很有讲究。"},{"id":"69B827290E","text":"B认为有机会就应睡够，也可能比较能睡懒觉。A羡慕B，并说自己随着年龄增长，晚上容易半途醒来，因此B可能比较年轻、睡眠较好。"},{"id":"68A1659BAD","text":"B在对话当天吃过午饭；A曾询问B午饭吃了什么，具体食物未知。"},{"id":"F6BAF24555","text":"B有重要的朋友，曾与朋友一起旅行或观光。B认为朋友对放松身心很重要，也觉得以吃美食为目的的旅行非常棒。"},{"id":"0157D1FBB7","text":"B准备看一部秋季动画或电影，与A想看的作品相同。作品很受欢迎，含有一些血腥或惊悚画面；B可能谈到能否在 Amazon Prime 上观看。"},{"id":"A08830C29C","text":"B最近热衷麻将，了解麻将牌数量多，曾问是否需要全部记住，并指出实际打麻将还得凑齐人数、准备麻将牌等器具。"},{"id":"2C2EC69CDC","text":"B曾遭遇某件危险或可怕的事，使A惊讶并表示“太吓人了”；具体经历未得到确认。"},{"id":"0E6419C5F2","text":"B过去参加过某项运动，可能是剑道，是否持续至今不明。B认为进入大学后社团氛围会变化，可能仍与原社团成员保持联系；A用自行车社团举例表示认同。"},{"id":"1A05FCCA77","text":"B看过 Mister Donut（ミスド）的红薯甜甜圈广告，住在该连锁店附近。"},{"id":"F48AD8C6CB","text":"B今年吃过柿子，觉得柿子表皮滑、不容易削皮，也聊到葡萄等秋季水果。B可能认为关东的水果物价很高，但这一说法的立场不完全确定。"},{"id":"4DB875DA0B","text":"B爱好数字绘画，使用数位板；似乎已经习惯数字绘画，觉得难以回到传统绘画方式。"},{"id":"A3D720EF5E","text":"B今年夏天去过仙台；似乎并非以观光为目的，而是有其他事情要办。"},{"id":"B37C04967B","text":"B是一名学生，正在做生物学相关研究，研究对象是相较贝类而言与人类亲缘关系更近的生物。"},{"id":"25FB43D677","text":"B是大学生，会在学校食堂就餐；喜欢油豆腐，比荞麦面更喜欢乌冬面，吃过“赤いきつね”杯面；暑假期间也一直学习。"},{"id":"497677478B","text":"B爱玩需要合作的网络游戏；曾与网上认识的朋友一起玩《我的世界》（Minecraft）；朋友因升学分散各地。"},{"id":"52FDD37150","text":"B在咖啡馆兼职，除接待顾客外还负责手冲及虹吸壶咖啡；似乎工作多年，并同时兼顾学业。"},{"id":"ACCB679420","text":"B认为冬天适合露营，因为没有虫子、严冬比较好待；夏天太热，不适合待在帐篷中。"},{"id":"E6BAB4CAB2","text":"B通过漫画应用阅读不同题材的漫画，有时看到广告后产生兴趣而下载应用。"},{"id":"0368F8BFC4","text":"B爱好绘画，似乎会画漫画人物等题材。"},{"id":"4EA1A61857","text":"B计划在秋天去浅草旅行，认为浅草位于行程涉及两处地点之间；因疫情而对乘坐电车感到担忧。"},{"id":"FB45DCB6D0","text":"B尚未完成换季整理，家居服仍是夏装；夏季只淋浴，天气转冷后开始在浴缸放热水泡澡。"},{"id":"A45D3A6917","text":"B平时主要喝茶或水，外出时偶尔喝咖啡。"},{"id":"CB6A20F929","text":"B在三连休期间有兼职工作；没有汽车，但似乎不觉得不方便。"},{"id":"1AC8060D0B","text":"B把麻将当作爱好，最近也很着迷；学生时代曾有一段时间玩过麻将。"},{"id":"A8546FC623","text":"B似乎曾在仙台吃过牛舌。"},{"id":"8F2630250F","text":"B想看秋季上映的动画电影（推测与《咒术回战》有关），期待能在 Amazon Prime 上观看。"},{"id":"90126EA0AB","text":"B似乎没有感染过新冠；A曾讲述自己的感染经历并提醒B注意防护。"},{"id":"4DD5104F67","text":"B喜欢春天，而且没有花粉症。"},{"id":"22D6A9E2DA","text":"B会网购，但担心网上购买衣服时尺码不合适。"},{"id":"9D4DE32546","text":"B正临近毕业，正在撰写毕业论文。"},{"id":"040BB81467","text":"B住在关东地区，并有上学或通勤的活动。"},{"id":"5E7EFFD384","text":"B曾参加自行车社团；初中、高中时参加过吹奏乐部，进入大学后没有继续加入吹奏乐部。"},{"id":"3D2B6D5D4C","text":"B来自冈山县，后来去了关东地区，对当地水果价格差异感到惊讶。"},{"id":"F442984697","text":"B工作日每天吃味噌汤配米饭，休息日更偏爱面包，尤其早餐喜欢吃面包。"},{"id":"25273502D8","text":"B喜欢咖啡，而且每天都会喝。"},{"id":"C0D8FFD8B4","text":"B有驾照并经常开车，周末会开车外出，爱好自驾兜风。"},{"id":"1017E14D2B","text":"B最近经常看动画，也正热衷麻将。"},{"id":"EDC0186954","text":"B安排旅行时往往排得过满，向往节奏悠闲的旅行。"},{"id":"4D33D18A75","text":"B有一个女儿，女儿最近想用电脑画画；起初想买液晶数位屏，但价格太高，因此B在拍卖网站寻找较小的数位板。"},{"id":"16C3A3CD31","text":"B小时候给水果削皮时，曾经总是把皮削得很厚。"},{"id":"5A8D36E6CD","text":"B有妹妹；妹妹曾告诉B角岛大桥很漂亮。"},{"id":"A20F413494","text":"B不久前终于见到一位很合得来的朋友；两人如今相隔较远，但仍保持线上联系。"},{"id":"0909F5B289","text":"B有时会在吐司上放奶酪和火腿，再加热烤着吃。"},{"id":"A57A856175","text":"B喜欢便利店售卖的关东煮，觉得最近销售关东煮的店变少了。"},{"id":"80A93D37B8","text":"B曾经历地震，当时住在关东地区，身处老旧建筑物，觉得很害怕。"},{"id":"F2C8E0FD6F","text":"B最近很在意 Mister Donut（ミスド）的红薯甜甜圈，但还没吃过。"},{"id":"028C4DEE82","text":"B是一名学生，暑假较长，大约从8月延续到9月。"},{"id":"4214E61D22","text":"B曾吃过晴王麝香葡萄（シャインマスカット），并为其美味感到惊喜。"},{"id":"014B9D03A1","text":"B认为泡澡时加入入浴剂能让心情变好。"},{"id":"AAC08F1E36","text":"B谈论过防灾准备，似乎提到储备用品会因为存放过久而变质或失效。"}];

   const fs=FACTS.filter(x=>x.pid===s.id);
   const score=fs.reduce((sum,p)=>sum+p.weight*(strongest[p.id]||0)/5,0);
   return {id:s.id,score,total:10,deduction:perP[s.id]};
  });
  const coverage=groups.reduce((x,g)=>x+g.score,0),deduction=Object.values(perP).reduce((a,b)=>a+b,0);
  const pointScores=FACTS.map(f=>({id:f.id,weight:f.weight,bestLevel:strongest[f.id]||0,score:f.weight*(strongest[f.id]||0)/5}));
  result[kind]={items:ids.length,pointCount:Object.keys(strongest).length,coverage,rawPenalty,deduction,final:Math.max(0,coverage-deduction),groups,perP,pointScores};
 }
 return result;
}
function fmt(x){return (Math.round(x*100)/100).toFixed(2).replace(/\.00$/,'');}
function renderResult(){$('reviewControls').innerHTML='';$('portraitStep').textContent='已提交';$('portraitCode').textContent='评分结果已揭示';$('portraitLeft').textContent='全部 74 条画像已审核并正式提交。加权评分结果显示在左侧。';$('pageTitle').textContent='审核结果（提交后揭盲）';$('position').textContent=`提交于 ${new Date(state.submitted_at).toLocaleString('zh-CN')}`;const r=calculate();const w=r.summary.final>r.direct.final?'Summary':r.direct.final>r.summary.final?'Direct':'两组相同';const gap=Math.abs(r.summary.final-r.direct.final);let html=`<div class="callout">这份成绩仅在提交后展示。事实点按各条画像的最高命中程度加权（1–5 对应 20%–100%），每个事实点只计一次；同一自述的重复矛盾扣分取最高值。<strong>当前结果：${esc(w)}${w==='两组相同'?'':` 领先 ${fmt(gap)} 分`}</strong>。</div><div class="resultgrid">${['summary','direct'].map(k=>`<div class="stat"><div class="caps">${k==='summary'?'SUMMARY':'DIRECT'}</div><div class="value">${fmt(r[k].final)} <span class="dim">/ 100</span></div><p>加权事实覆盖 ${fmt(r[k].coverage)} 分</p><p>矛盾扣分 −${fmt(r[k].deduction)} 分</p><p>唯一命中 ${r[k].pointCount} / ${FACTS.length} 点（取最高等级） · ${r[k].items} 条画像</p></div>`).join('')}</div><h3>按 10 条自述分项统计</h3><div class="tablebox"><table><thead><tr><th>B 自述</th><th>Summary 覆盖</th><th>Direct 覆盖</th><th>Summary 矛盾扣分</th><th>Direct 矛盾扣分</th></tr></thead><tbody>${SELF.map(s=>{const a=r.summary.groups.find(x=>x.id===s.id),b=r.direct.groups.find(x=>x.id===s.id);return `<tr><td>${s.id}</td><td class="num">${fmt(a.score)} / 10</td><td class="num">${fmt(b.score)} / 10</td><td class="num">${fmt(a.deduction)}</td><td class="num">${fmt(b.deduction)}</td></tr>`;}).join('')}</tbody></table></div><details><summary>查看命中事实点与原始条目的算法来源</summary>${['summary','direct'].map(k=>{const map=sourceKey();const ids=ITEMS.filter(x=>map[x.id].system===k);const hit=new Set();ids.forEach(it=>(state.answers[it.id]?.hits||[]).forEach(p=>hit.add(p)));return `<h3>${k}：${ids.length} 条</h3><p>唯一覆盖（最高等级与加权得分）：${r[k].pointScores.filter(x=>x.bestLevel>0).map(x=>esc(x.id+' '+byPoint[x.id].label+' · '+x.bestLevel+'/5 · '+fmt(x.score)+'/'+x.weight+'分')).join('；')||'无'}</p><p class="help">条目映射：${ids.map(x=>esc(map[x.id].row+' / '+x.id)).join('；')}</p>`;}).join('')}</details><div class="actions"><button id="downloadResult">导出完整评分 JSON</button><button id="downloadCsv">导出分项 CSV</button><button id="undo">撤回提交，继续编辑</button></div><div class="callout"><strong>计分说明：</strong>每个事实点的分数＝权重 ×（最佳命中等级 / 5）；同一算法重复命中仅取最高等级，总覆盖分满分 100。矛盾每条选 0–5 分，若涉及多条自述则等分；同组同一自述的矛盾只保留最大扣分。最终分 = max(0,覆盖分 − 去重后的矛盾扣分)。B 未提及的画像信息不自动记为矛盾。</div>`;
 $('content').innerHTML=html;$('downloadResult').onclick=()=>exportData(true);$('downloadCsv').onclick=exportCsv;$('undo').onclick=()=>{if(confirm('撤回提交会隐藏成绩并允许编辑，已填答案不会丢失。是否继续？')){state.submitted_at=null;save();goto(0);}};}
function payload(withScores){const o={schema:SCHEMA,reviewer:state.reviewer||'anonymous',exported_at:new Date().toISOString(),created_at:state.created_at,index:state.index,submitted_at:state.submitted_at,reviewed:reviewed(),total:ITEMS.length,order:state.order,responses:state.order.map(id=>({item_id:id,...normalized(state.answers[id])}))};if(withScores&&state.submitted_at){o.scoring_method='sum over unique gold facts: weight * max hit level(1..5)/5, then subtract max contradiction by self-statement (0..5 per row, divided between selected statements)';o.results=calculate();}return o;}
function download(name,str,type='application/json;charset=utf-8'){const blob=new Blob([str],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportData(withScores){state.reviewer=$('reviewer').value.trim();save();const s=payload(withScores);download(`portrait_review_v5_${(state.reviewer||'anonymous').replace(/[^a-zA-Z0-9_-]/g,'_')}.json`,JSON.stringify(s,null,2));}
function exportCsv(){const r=calculate(),rows=[['自述','Summary加权覆盖','Direct加权覆盖','Summary矛盾扣分','Direct矛盾扣分']];SELF.forEach((s,i)=>rows.push([s.id,r.summary.groups[i].score,r.direct.groups[i].score,r.summary.groups[i].deduction,r.direct.groups[i].deduction]));rows.push(['总覆盖',r.summary.coverage,r.direct.coverage,'','']);rows.push(['总矛盾扣分','','',r.summary.deduction,r.direct.deduction]);rows.push(['最终得分',r.summary.final,r.direct.final,'','']);download('portrait_review_v5_1_score.csv','\ufeff'+rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function loadProgress(text){
 let d;
 try{d=JSON.parse(text);}catch(e){alert('文件不是有效 JSON');return;}
 if(!validImport(d)){alert('不是兼容的 V5 / V5.1 / V5.2 进度文件');return;}
 if(!confirm('导入记录将覆盖本页面当前答案。确定继续吗？'))return;
 const next={schema:SCHEMA,reviewer:String(d.reviewer||''),index:0,order:[...d.order],answers:{},submitted_at:null,created_at:String(d.created_at||new Date().toISOString())};
 const rows=Array.isArray(d.responses)?d.responses:Object.entries(d.answers||{}).map(([item_id,a])=>({item_id,...a}));
 for(const a of rows)if(Object.hasOwn(byId,a.item_id))next.answers[a.item_id]=normalized(a);
 // 保留原审核位置。旧版导出的 JSON 没有 index 时，自动定位第一个未完成的条目。
 const firstIncomplete=next.order.findIndex(id=>!good(next.answers[id]));
 next.index=Number.isInteger(d.index)&&d.index>=0&&d.index<=ITEMS.length?d.index:(firstIncomplete<0?ITEMS.length:firstIncomplete);
 // 只允许已完成 74 条的文件恢复“已提交”状态，防止有缺项时提前展示成绩。
 const allDone=next.order.every(id=>good(next.answers[id]));
 if(d.submitted_at&&allDone){next.submitted_at=String(d.submitted_at);next.index=ITEMS.length;}
 state=next;save();render();
}
$('reviewer').oninput=e=>{state.reviewer=e.target.value;save();};$('jump').onchange=e=>{if(!state.submitted_at)goto(Number(e.target.value));};$('saveDraft').onclick=()=>exportData(!!state.submitted_at);$('loadDraft').onclick=()=>$('draftFile').click();$('draftFile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(loadProgress);e.target.value='';};$('restart').onclick=()=>{if(!confirm('清空全部答案，生成新的随机顺序？此操作不可撤销。'))return;state=fresh();save();render();};
save();render();
