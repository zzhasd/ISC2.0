const SELF=[{"id":"P1","ja":"学習塾の事務の仕事を10年以上している。","zh":"在学习塾（课外补习机构）从事事务工作已有10年以上。"},{"id":"P2","ja":"埼玉県以外に住んだことがない。","zh":"从未在埼玉县以外的地方居住。"},{"id":"P3","ja":"現在は自粛しているが、旅行が好きである。","zh":"喜欢旅行，但自述时正因自肃而暂缓或减少旅行。"},{"id":"P4","ja":"生き物が好きで、今は文鳥とメダカを飼っている。","zh":"喜欢动物／生物，当时同时养着文鸟和青鳉鱼（メダカ）。"},{"id":"P5","ja":"緑の多い公園を散歩したり、野鳥観察をすることが多い。","zh":"经常到绿植丰富的公园散步，也经常观察野鸟。"},{"id":"P6","ja":"休日が2日あるならば、1日は出かけて、もう1日はのんびりしたい。","zh":"如果有两天休假，希望一天外出、另一天悠闲休息。"},{"id":"P7","ja":"姉御肌と言われる。","zh":"别人评价自己有“姉御肌”（大姐头、豪爽可靠）的气质。"},{"id":"P8","ja":"車の運転が好きで山道は問題ないが、首都高は走りたくない。","zh":"喜欢驾驶汽车，开山路没有问题，但不想开首都高速。"},{"id":"P9","ja":"1日に1回はチョコレートを食べる。","zh":"每天至少吃一次巧克力。"},{"id":"P10","ja":"景色のきれいな温泉宿でくつろぎたい。","zh":"希望在风景优美的温泉旅馆悠闲放松。"}];
const FACTS=[{"id":"P1a","pid":"P1","label":"在学习塾（补习机构）工作","weight":4},{"id":"P1b","pid":"P1","label":"岗位为事务／行政工作","weight":3},{"id":"P1c","pid":"P1","label":"从事该工作已有10年以上","weight":3},{"id":"P2a","pid":"P2","label":"曾在埼玉县居住（须明确埼玉；仅“关东”不足以命中）","weight":4},{"id":"P2b","pid":"P2","label":"从未在埼玉县以外的地方居住","weight":6},{"id":"P3a","pid":"P3","label":"喜欢旅行（明确的个人偏好，而不只是去过某地）","weight":6},{"id":"P3b","pid":"P3","label":"自述时处于自肃状态，暂缓／减少旅行","weight":4},{"id":"P4a","pid":"P4","label":"喜欢动物或其他生物","weight":2},{"id":"P4b","pid":"P4","label":"当时养有鸟作为宠物","weight":2},{"id":"P4c","pid":"P4","label":"所养的鸟明确是文鸟","weight":2},{"id":"P4d","pid":"P4","label":"当时养有メダカ（青鳉鱼）","weight":4},{"id":"P5a","pid":"P5","label":"经常去公园散步","weight":3},{"id":"P5b","pid":"P5","label":"散步所去的公园绿植丰富","weight":2},{"id":"P5c","pid":"P5","label":"经常观察野鸟（野鸟观察是常做的活动）","weight":5},{"id":"P6a","pid":"P6","label":"如果有两天假，倾向安排一天出门","weight":5},{"id":"P6b","pid":"P6","label":"如果有两天假，倾向另一天悠闲休息","weight":5},{"id":"P7a","pid":"P7","label":"被他人评价为“姉御肌”（豪爽可靠、照顾人的大姐头气质）","weight":10},{"id":"P8a","pid":"P8","label":"喜欢开车／驾驶本身","weight":4},{"id":"P8b","pid":"P8","label":"驾驶山路没有问题","weight":3},{"id":"P8c","pid":"P8","label":"不愿驾驶首都高速公路","weight":3},{"id":"P9a","pid":"P9","label":"每天至少吃一次巧克力（含频率信息）","weight":10},{"id":"P10a","pid":"P10","label":"希望在温泉旅馆悠闲休息／放松","weight":6},{"id":"P10b","pid":"P10","label":"希望温泉旅馆有优美景色","weight":4}];
const ITEMS=[{"id":"F882F74C38","text":"B的父亲过去是某支运动队的球迷（A用过去时「でした」提问，暗示父亲已不再是或已不关注该队）。B本人可能也观看运动赛事（A的后续提问「何をよく見ますか？」预设B有观看运动的习惯，但此点仅为推测）。"},{"id":"893A290732","text":"B没有花粉症（A在D2和D12中均确认此点，A表示羡慕）。但B并不觉得春天特别舒适——B提到春季温差大（気温差が激しい）、三月虽已入春但还需穿外套，A对此表示认同。B可能不以春天为最喜欢的季节（A在B表达偏好后特意追问春天，暗示B未将春天列为首选）。"},{"id":"531EFB7DF5","text":"B有食物过敏，很可能是荞麦（蕎麦）过敏。A在D2中提到自己有荞麦过敏，B回应「私と一緒だ！」，由此推断B同样有荞麦过敏。"},{"id":"BC36C436FC","text":"B的爱好是饲养青鳉鱼（メダカ），且饲养数量较多（A感叹「多いですね！」）。B对青鳉鱼有较深入的了解：知道有专门出售青鳉鱼的专卖店（専門店），了解部分品种价格高昂，并解释高价与品种改良（品種改良）有关。B还讨论了适合青鳉鱼饲养/繁殖的环境条件。A曾问B是否也尝试进行品种改良（「あなたも改良とか試したりするのですか？」），其中「も」暗示B可能参与品种改良活动，但此点确定性较低。"},{"id":"1FC77DFE46","text":"B在D4中提到了海，但更偏好山（A随后追问「山では何するのですか？」，暗示B选择了山而非海）。"},{"id":"B77C30F6D7","text":"B曾去过新潟并品尝了当地食物（A追问「美味しかったですか？」并表达羡慕）。B还推荐了新潟的一处温泉，该温泉提供住宿（A问「泊まりもできるのですか？」）。"},{"id":"2EEF530488","text":"B有跑步锻炼的习惯，且跑步距离较长（A评价「結構長いですね！」），有一定的规律频率（A追问「どれくらいの頻度ですか？」）。B觉得跑步比预想的更辛苦（「思った以上にしんどいですよね」）。近期天气凉爽，B可能将此作为跑步的有利条件提及（A说「最近涼しいですもんね！」）。"},{"id":"2A3464062C","text":"B曾有过食物中毒（食あたり）的经历，描述为相当严重/难受（A回应「それは大変でしたね」并追问是否一直腹泻）。"},{"id":"2F14A28959","text":"B自己在家做晚餐（A问「自分で作られるのですか？」并赞叹「すごいですね！」），被A称赞为勤快（マメ）。B的得意料理是煮物（炖菜），经常制作且手艺较好，A表示尊敬（「私は炒め物くらいしか作れないので尊敬します！」）。B的煮物被A形容为看起来美味。"},{"id":"9679CFCF44","text":"B在D8中提到了某件物品，A询问是否为日常用品（日常品）。B曾询问A是否喜欢威士忌/酒（A回答「はい、大好きです！」）。B自己在家酿造梅酒（A问「梅酒作ってるんですか？」）。A还问了B是否有喜欢的酒（「好きなお酒はありますか？」），暗示B有饮酒偏好，但具体喜好未知。"},{"id":"515A2A0E0B","text":"B计划在第二天进行囤货购物（買いだめ），且做事有计划性（A评价「計画的ですね！」）。"},{"id":"270876AFEE","text":"B喜欢蓝色（青），认为蓝色给人清爽的感觉（爽やか）。B也提到过红色（赤），并且拥有红色衣服（「確かに赤い服もありますが」）。"},{"id":"72662B8DAD","text":"截至D10对话时，B尚未进行换季整理（衣替え），表示「もうそろそろしないとですよね」，即拖延中。"},{"id":"D1C1F186DD","text":"B平时不太外出（A问「普段からあまりお出かけはされないんですか？」），三连休（3連休）也没有出门。B认为这与新冠疫情（コロナ）的影响有关，觉得当前状况令人困扰（A回应「大変ですね」）。尽管全国旅行支援等新政策已推出、社会自粛氛围逐渐消退，B仍受其影响。"},{"id":"A588DB61EB","text":"B喜欢的是驾驶本身（开车兜风的体验），而非汽车这个物件（A区分后确认「走るのが好きなのですね」，B认可）。"},{"id":"2860DF5FD6","text":"截至D13对话时，B尚未取出冬装（A说「うちもまだですね」表示双方都还没做）。B认为整理/分类衣物需要花时间（「かかりますね」），且觉得此事有些麻烦（A回应「それは大変ですね」）。B与A不在同一地点（A用「そちら」指代B的所在地）。B有一个即将到来的连休（連休），A提议如果没事可以做此事。"},{"id":"B2B7E18C37","text":"B购买了一件针织衫（ニット），颜色被A形容为有秋天的感觉（「秋っぽいです」）。B原本计划在某个外出日穿这件针织衫，但该外出计划被推迟了。推迟后的计划是一个多人聚餐（食事会），因人数较多所以协调时间困难，但最终大家的时间对上了。推迟的日期距对话时较远，届时天气可能更冷。B将参加这个改期后的聚餐（A说「楽しんできてください」）。B已拥有该针织衫（A问「早速着てみましたか？」）。"},{"id":"530D7723FC","text":"B当天午餐吃了意面（パスタ），是番茄口味的（A确认「トマト系好きなんですよね」）。B喜欢番茄酱意面，之前觉得油基意面（オイル系）不太合口味，因为油基意面不像番茄那样味道鲜明（「確かにトマトのようなはっきりとした味ではないですよね」）。B熟悉或使用冷冻意面（A说「冷凍パスタ楽ですよね」，B似有认同）。B还提到煮面的火候/口感很重要（「ゆで加減大事ですもんね」）。"},{"id":"EA571AEAB7","text":"B曾去韩国旅行，目的是参加一位熟人的婚礼。B描述了韩国婚礼的一些做法（如在非正式会场/大厅而非专门会场举行、有邀请客在场却发生某事等），令A感到惊讶，B解释这在韩国是普通的。B在婚礼上吃了食物，评价为不错（A回应「それは良かったです」）。B还说了某些令A觉得「すごい」的事情。"},{"id":"5EAFA1AE0E","text":"B有泡澡（湯船に浸かる）的习惯，使用入浴剂（入浴剤），似乎是粉末型且溶解快（A确认「確かに、すぐ溶けますしね」）。对话当天B计划泡澡（A问「今日は何入れますか？」并叮嘱「寒いので、ゆっくり温まってください」「湯冷めしないように気を付けてくださいね」）。A向B推荐了ウルモア入浴剂（「是非試してみて欲しいです」）。A还提到天气变冷后身体乳（ボディクリーム）也快成必需品了。B可能觉得天冷后只冲淋浴已不够（A问「流石にシャワーだとそろそろ厳しくなってきませんか？」）。"},{"id":"62AB1A1D6A","text":"B有猪肉（豚肉），用猪肉做炒菜/炒め物（A评价「炒め物良いですね。簡単ですし」，B回应可变换调味）。B喜欢辣的食物，吃咖喱时选择辛口（最辣等级）。B在家做咖喱，但尚未尝试过加入酱油和番茄酱作为隐藏调味的方法（A推荐B有机会试试）。"},{"id":"BDE5395415","text":"B在夏天去过长野旅行。B还提到了函馆（Hakodate），描述了其夜景之美，并提及当地特产如扇贝（ホタテ）和螃蟹（カニ）。B平时不常吃螃蟹（「食べないですね」），但可能在旅行时会吃。B的旅行时间可能在新冠之前（A追问「コロナ前ですか？」）。"},{"id":"BC21EEFAA4","text":"B养了一只鸟作为宠物，鸟养在笼子里（ケージ）。鸟与人亲近后会停在人身上（「懐くと乗ってくるんですね」）。B使用宠物专用加热器（ペット専用のヒーター）为鸟取暖，并有夏季和冬季为鸟调节温度的经验（A感叹「真夏とか真冬の温度調節が大変そうですね」）。B有饲养活物的经验。"},{"id":"DA5F751EFE","text":"B喜欢观看赛马，有时会一整天都在看；B也将马视为竞技运动的一部分，并欣赏不同马匹的个性。B尤其喜欢名为“ソダシ”（Sodashi）的白马，觉得它漂亮、罕见。"},{"id":"7197681D95","text":"B看过棒球比赛，尤其曾在电视上观看读卖巨人队的比赛；B的父亲是巨人队球迷，两人曾一起看球。B还谈起过与父亲争吵的经历。"},{"id":"88340D4B93","text":"B没有花粉症，A1对此表示羡慕。"},{"id":"B79A6AF36D","text":"B可能经历过食物过敏或食物中毒。A1说到自己的荞麦过敏时回应“和我一样”，暗示B有类似经历，但具体过敏食物与症状不明。"},{"id":"825770BE10","text":"B的爱好是饲养青鳉鱼（メダカ），养了相当多的鱼。B了解青鳉鱼专卖店及价格昂贵的品种，也尝试进行品种改良，关注养殖环境的管理。"},{"id":"7DE24235CC","text":"B在海与山之间更偏爱山，也喜欢温泉；曾在新潟的温泉住宿，享受当地餐食。"},{"id":"B831FE6ADF","text":"B经常跑步，跑步距离长到让A1感叹“真长”。具体频率和距离未知，但B似乎有持续运动的习惯。"},{"id":"A8D623D1CF","text":"B曾经历食物中毒，可能持续腹泻较长时间；A1询问是否“一直腹泻”并表示同情，因此推测B讲述过这段经历。"},{"id":"9E63A67B3F","text":"B经常自己做饭，不太外食；习惯集中清洗餐具。A1称赞B勤快且有条理。"},{"id":"0EF25C5DDA","text":"B喜欢威士忌。A1谈到威士忌时回答“非常喜欢”。B可能习惯自行购买整瓶酒，也会自制梅酒；但部分饮酒喜好可能是A1的自述。"},{"id":"FCA4D769F7","text":"B有计划地囤购日用品，擅长做炖煮菜（煮物），也会做关东煮萝卜。"},{"id":"4DDE86D677","text":"B喜欢蓝色，理由是蓝色给人清爽的感觉。"},{"id":"5C53A15DFB","text":"B习惯及时整理换季衣物。A1说自己懒散时，推测B已经认真完成了换季整理。"},{"id":"5479396D5E","text":"B爱好开车兜风，尤其喜欢驾驶过程本身；有时经高速或普通道路开到邻县，喜欢在导航辅助下尝试不同路线。"},{"id":"A5A105FDC5","text":"B没有花粉症；A2说自己离不开鼻喷剂，并对B没有花粉症表示羡慕。"},{"id":"B2D525E1D1","text":"B最喜欢的季节不是春天。A2原以为不过敏的人往往喜欢春天，因而推测B回答说并不喜欢春季。"},{"id":"7EE8771612","text":"截至D13对话时，B尚未取出冬装或完成换季整理；也可能没有卖过旧衣服或很少卖衣服。A2曾问B是否卖衣服，并表示这件事很麻烦。"},{"id":"3014B949F9","text":"B为冬季买了一件针织衫，颜色带有秋季氛围。原计划某次外出穿，但那次多人聚餐改期到较久以后，届时天气可能更冷。"},{"id":"F1AA2B0BCE","text":"B喜欢意面，尤其喜欢番茄酱口味。A2曾询问这是否也是B最爱的口味；B可能以前不喜欢某种意面（推测为橄榄油口味），后来逐渐接受。"},{"id":"E86BA16414","text":"B曾去韩国参加熟人的婚礼，该熟人可能与韩国人结婚。B详细谈过韩式婚礼，包括在大厅收礼金等与日本不同的习俗，并对这些差异感到惊讶。"},{"id":"86D6BFEBB6","text":"B在寒冷时习惯泡澡并使用入浴剂；画像称B使用的是固体或碳酸型入浴剂而非粉末型，也使用身体乳。"},{"id":"AE0092C088","text":"B喜欢辣味，咖喱选择辣口；也喜欢做炒菜，并会变化不同调味方法。"},{"id":"311ED92455","text":"B夏天曾去长野旅行并泡温泉；还提到印象深刻的函馆之旅，描述函馆夜景及扇贝、螃蟹等当地特产。"},{"id":"C6B4DDB730","text":"B每年都会吃螃蟹。A2说自己不常吃，并询问B是否每年都吃，因此画像推断B有此习惯。"},{"id":"1D358B91F5","text":"B养鸟当宠物，有时会把鸟放到房间里活动；亲人的鸟会停在肩膀或手上。B还观察过鸟睡觉时圆滚滚的样子及羽毛状态。"},{"id":"804C294FEB","text":"B为宠物鸟使用专用加热器，并在夏冬使用空调调节温度。"}];

  const ids=ITEMS.filter(i=>map[i.id].system===kind).map(x=>x.id);
  const strongest={}; // 每个事实点只取该算法各条画像中的最高命中等级
  const perP={};SELF.forEach(s=>perP[s.id]=0);
  let rawPenalty=0;
  for(const id of ids){
   const a=normalized(state.answers[id]);
   a.hits.forEach(fid=>{strongest[fid]=Math.max(strongest[fid]||0,a.hitLevels[fid]??5);});
   rawPenalty+=a.penalty||0;
   if(a.penalty>0&&a.topics.length){const share=a.penalty/a.topics.length;for(const p of a.topics)perP[p]=Math.max(perP[p],share);}
  }
  const groups=SELF.map(s=>{
   const fs=FACTS.filter(x=>x.pid===s.id);
   const score=fs.reduce((sum,p)=>sum+p.weight*(strongest[p.id]||0)/5,0);
   return {id:s.id,score,total:10,deduction:perP[s.id]};
  });
  const coverage=groups.reduce((x,g)=>x+g.score,0),deduction=Object.values(perP).reduce((a,b)=>a+b,0);
  const pointScores=FACTS.map(f=>({id:f.id,weight:f.weight,bestLevel:strongest[f.id]||0,score:f.weight*(strongest[f.id]||0)/5}));
  result[kind]={items:ids.length,pointCount:Object.keys(strongest).length,coverage,rawPenalty,deduction,final:Math.max(0,coverage-deduction),groups,perP,pointScores};
 }
 return result;
}
function fmt(x){return (Math.round(x*100)/100).toFixed(2).replace(/\.00$/,'');}
function renderResult(){$('reviewControls').innerHTML='';$('portraitStep').textContent='已提交';$('portraitCode').textContent='评分结果已揭示';$('portraitLeft').textContent='全部 49 条画像已审核并正式提交。加权评分结果显示在左侧。';$('pageTitle').textContent='审核结果（提交后揭盲）';$('position').textContent=`提交于 ${new Date(state.submitted_at).toLocaleString('zh-CN')}`;const r=calculate();const w=r.summary.final>r.direct.final?'Summary':r.direct.final>r.summary.final?'Direct':'两组相同';const gap=Math.abs(r.summary.final-r.direct.final);let html=`<div class="callout">这份成绩仅在提交后展示。事实点按各条画像的最高命中程度加权（1–5 对应 20%–100%），每个事实点只计一次；同一自述的重复矛盾扣分取最高值。<strong>当前结果：${esc(w)}${w==='两组相同'?'':` 领先 ${fmt(gap)} 分`}</strong>。</div><div class="resultgrid">${['summary','direct'].map(k=>`<div class="stat"><div class="caps">${k==='summary'?'SUMMARY':'DIRECT'}</div><div class="value">${fmt(r[k].final)} <span class="dim">/ 100</span></div><p>加权事实覆盖 ${fmt(r[k].coverage)} 分</p><p>矛盾扣分 −${fmt(r[k].deduction)} 分</p><p>唯一命中 ${r[k].pointCount} / ${FACTS.length} 点（取最高等级） · ${r[k].items} 条画像</p></div>`).join('')}</div><h3>按 10 条自述分项统计</h3><div class="tablebox"><table><thead><tr><th>B 自述</th><th>Summary 覆盖</th><th>Direct 覆盖</th><th>Summary 矛盾扣分</th><th>Direct 矛盾扣分</th></tr></thead><tbody>${SELF.map(s=>{const a=r.summary.groups.find(x=>x.id===s.id),b=r.direct.groups.find(x=>x.id===s.id);return `<tr><td>${s.id}</td><td class="num">${fmt(a.score)} / 10</td><td class="num">${fmt(b.score)} / 10</td><td class="num">${fmt(a.deduction)}</td><td class="num">${fmt(b.deduction)}</td></tr>`;}).join('')}</tbody></table></div><details><summary>查看命中事实点与原始条目的算法来源</summary>${['summary','direct'].map(k=>{const map=sourceKey();const ids=ITEMS.filter(x=>map[x.id].system===k);const hit=new Set();ids.forEach(it=>(state.answers[it.id]?.hits||[]).forEach(p=>hit.add(p)));return `<h3>${k}：${ids.length} 条</h3><p>唯一覆盖（最高等级与加权得分）：${r[k].pointScores.filter(x=>x.bestLevel>0).map(x=>esc(x.id+' '+byPoint[x.id].label+' · '+x.bestLevel+'/5 · '+fmt(x.score)+'/'+x.weight+'分')).join('；')||'无'}</p><p class="help">条目映射：${ids.map(x=>esc(map[x.id].row+' / '+x.id)).join('；')}</p>`;}).join('')}</details><div class="actions"><button id="downloadResult">导出完整评分 JSON</button><button id="downloadCsv">导出分项 CSV</button><button id="undo">撤回提交，继续编辑</button></div><div class="callout"><strong>计分说明：</strong>每个事实点的分数＝权重 ×（最佳命中等级 / 5）；同一算法重复命中仅取最高等级，总覆盖分满分 100。矛盾每条选 0–5 分，若涉及多条自述则等分；同组同一自述的矛盾只保留最大扣分。最终分 = max(0,覆盖分 − 去重后的矛盾扣分)。B 未提及的画像信息不自动记为矛盾。</div>`;
 $('content').innerHTML=html;$('downloadResult').onclick=()=>exportData(true);$('downloadCsv').onclick=exportCsv;$('undo').onclick=()=>{if(confirm('撤回提交会隐藏成绩并允许编辑，已填答案不会丢失。是否继续？')){state.submitted_at=null;save();goto(0);}};}
function payload(withScores){const o={schema:SCHEMA,reviewer:state.reviewer||'anonymous',exported_at:new Date().toISOString(),created_at:state.created_at,index:state.index,submitted_at:state.submitted_at,reviewed:reviewed(),total:ITEMS.length,order:state.order,responses:state.order.map(id=>({item_id:id,...normalized(state.answers[id])}))};if(withScores&&state.submitted_at){o.scoring_method='sum over unique gold facts: weight * max hit level(1..5)/5, then subtract max contradiction by self-statement (0..5 per row, divided between selected statements)';o.results=calculate();}return o;}
function download(name,str,type='application/json;charset=utf-8'){const blob=new Blob([str],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportData(withScores){state.reviewer=$('reviewer').value.trim();save();const s=payload(withScores);download(`portrait_review_HU_v5_3_${(state.reviewer||'anonymous').replace(/[^a-zA-Z0-9_-]/g,'_')}.json`,JSON.stringify(s,null,2));}
function exportCsv(){const r=calculate(),rows=[['自述','Summary加权覆盖','Direct加权覆盖','Summary矛盾扣分','Direct矛盾扣分']];SELF.forEach((s,i)=>rows.push([s.id,r.summary.groups[i].score,r.direct.groups[i].score,r.summary.groups[i].deduction,r.direct.groups[i].deduction]));rows.push(['总覆盖',r.summary.coverage,r.direct.coverage,'','']);rows.push(['总矛盾扣分','','',r.summary.deduction,r.direct.deduction]);rows.push(['最终得分',r.summary.final,r.direct.final,'','']);download('portrait_review_HU_v5_3_score.csv','\ufeff'+rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function loadProgress(text){
 let d;
 try{d=JSON.parse(text);}catch(e){alert('文件不是有效 JSON');return;}
 if(!validImport(d)){alert('这不是当前新 B（HU）问卷的进度文件');return;}
 if(!confirm('导入记录将覆盖本页面当前答案。确定继续吗？'))return;
 const next={schema:SCHEMA,reviewer:String(d.reviewer||''),index:0,order:[...d.order],answers:{},submitted_at:null,created_at:String(d.created_at||new Date().toISOString())};
 const rows=Array.isArray(d.responses)?d.responses:Object.entries(d.answers||{}).map(([item_id,a])=>({item_id,...a}));
 for(const a of rows)if(Object.hasOwn(byId,a.item_id))next.answers[a.item_id]=normalized(a);
 // 保留原审核位置。旧版导出的 JSON 没有 index 时，自动定位第一个未完成的条目。
 const firstIncomplete=next.order.findIndex(id=>!good(next.answers[id]));
 next.index=Number.isInteger(d.index)&&d.index>=0&&d.index<=ITEMS.length?d.index:(firstIncomplete<0?ITEMS.length:firstIncomplete);
 // 只允许已完成 49 条的文件恢复“已提交”状态，防止有缺项时提前展示成绩。
 const allDone=next.order.every(id=>good(next.answers[id]));
 if(d.submitted_at&&allDone){next.submitted_at=String(d.submitted_at);next.index=ITEMS.length;}
 state=next;save();render();
}
$('reviewer').oninput=e=>{state.reviewer=e.target.value;save();};$('jump').onchange=e=>{if(!state.submitted_at)goto(Number(e.target.value));};$('saveDraft').onclick=()=>exportData(!!state.submitted_at);$('loadDraft').onclick=()=>$('draftFile').click();$('draftFile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(loadProgress);e.target.value='';};$('restart').onclick=()=>{if(!confirm('清空全部答案，生成新的随机顺序？此操作不可撤销。'))return;state=fresh();save();render();};
save();render();
