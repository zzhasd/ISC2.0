const ITEMS=[{"id":"C8350ABF7F","text":"B的名字为[PERSON]，在另一段对话中A2称呼B为「sakaiさん」。关于B的姓名存在两种表述（[PERSON]与sakai），可能为同一人的不同称呼方式，也可能存在身份标注不一致的情况。"},{"id":"CF5D037DE9","text":"B处于20多岁年龄段（20代）。"},{"id":"0364C91669","text":"B曾从事営業（销售）工作并已离职。B的営業工作是正常去公司上班（通勤），而非远程办公。B觉得通勤上班很辛苦（A2表示慰问「お疲れ様でした」）。"},{"id":"0E1181F07A","text":"B目前在学习或计划学习设计（デザイン），并有一个未来的职业目标，A2表示会为其加油。"},{"id":"22DEE63ACA","text":"B的兴趣爱好是种植植物，且种植了多种植物（不仅是一种）。具体包括：ゴムの木（橡胶树）和オリーブ（橄榄树）。B还养有会吸引昆虫的植物（如カメムシ等），曾提到植物和虫是不可分割的。B可能居住在有庭院的地方或拥有大量植物。B对植物有一定的种植经验和知识。"},{"id":"571717B65D","text":"B对植物有具体知识：知道橡胶树的汁液不需要切割就会自然渗出（傷つけなくても勝手に出る）；了解橄榄树需要长到一定大小才能结果；认为橡胶树在日本是很常见/受欢迎的植物。"},{"id":"C5E588EEA1","text":"B已故的父亲生前精心培育了树木，结出的果实给B留下了记忆。B从小在父亲种植物的环境中成长，对植物有各种各样的记忆和知识。"},{"id":"D4C72CF081","text":"B出身于兵库县（兵庫），家（実家）在大阪，属于关西地区。B目前位于大阪（或居住在大阪）。B在日本。"},{"id":"356E329E36","text":"B曾有一段约6年的恋爱关系，期间曾考虑过是否结婚。关于这段关系的现状存在矛盾信息：一段对话中B表示「今は彼女と一緒に住んでます」（现在和女朋友同居），但另一段对话中A2暗示B目前单身并祝B找到好的恋人（「いい出会いがあるといいですね」「sakaiさんもいい恋人できるといいですね」）。B的恋爱关系曾为远距（遠距離）。B曾提到伴侣有些邋遢/不整洁（だらしなさ），B对此感到不悦。综合来看，B的恋爱关系可能已结束或状态存在不确定性。"},{"id":"38FA1886E4","text":"B喜欢作家筒井康隆（Tsutsui Yasutaka），有自己的喜欢的作家。B曾向A推荐了一本书（可能是短篇小说集），A用「こじらせてて悪魔的」来形容。B还曾讨论过町田康（Machida Ko）的作品被改编为电影的话题（A纠正说夫婦茶碗并未被拍成电影）。"},{"id":"1DB038E6C1","text":"B在对话期间正在观看某内容（可能是动画或电影），A2询问B在看什么并鼓励B慢慢看完。B曾向A提问，A表示「お気軽にお尋ねください」。B在对话中向A2打了招呼（よろしくお願します）。"},{"id":"06D4537506","text":"B在实家（父母家）时，饭食不会自动端上来，需要自己准备或寻找食物。"},{"id":"4AAA7CF34E","text":"B可能经常待在家里（A2问「大体ずっと家にいるんですか？」），且可能目前在做远程工作（リモート），导致运动不足。注意：这与B之前営業工作需通勤并不矛盾，因为B已从営業离职，目前处于学习设计的新阶段。B觉得待在家里最放松/舒适。"},{"id":"4A1CC19CA4","text":"B喜欢吃东西（食べるのが好き），与A2食量大致相同。B和A2可能经常一起吃饭或同住（D8中A2说「二人とも食べるの好きなんですよね」）。注意：D8的partner为A2，此处的「二人」可能指B和B的伴侣而非B和A2，存在归属不确定性。"},{"id":"9A14C379FB","text":"B使用日语交流。B与A2是较为随意的交流关系（同事或熟人，语气礼貌且有话题分享）。"},{"id":"8BFC3CC451","text":"B曾向A推荐或提及イカ墨パスタ（乌贼墨意面），表示还没吃过。B与A讨论了甲壳类过敏相关话题：B曾提到甲壳类过敏，A回应说自己之前也以为是甲壳类过敏所以没吃过，后来做了过敏检查发现不是。B询问A是否做过过敏检查，也询问了A吃了什么（虾等甲壳类食物）。B还询问A是否做完饭了，并对A忙碌表示关心/道歉。B还询问了A当天工作情况。"},{"id":"826D4D1032","text":"B曾被カメムシ（椿象/臭虫）落在脖子上，B试图将虫子放到外面。A2建议B需要洗澡，并询问是否成功把虫子放走了。B当时可能在外或刚从外面回来（A问「室内に出たんですか」）。"},{"id":"7A2D3286DD","text":"B曾养过甲虫或昆虫（「自分も育ててました」）。B家中过去曾出现过昆虫（可能包括蟑螂等），但已经很久没在家里看到了。"},{"id":"64F8122AD0","text":"B曾就某个地方表达过印象/形象（「確かにそんなイメージありますね」），可能与A居住或常去的地方有关。"},{"id":"B3151686FB","text":"B纠正了A1对冲绳料理的误解：A1原以为冲绳食物是こってり（浓郁油腻）的，B表示并非如此。"},{"id":"2A57E1FE35","text":"B在新冠疫情期间感到外出困难，觉得去哪里都有风险。B可能因此限制了外出或对此感到焦虑。"},{"id":"DC90E13889","text":"B在玩或关注FINAL FANTASY XIV（FF14），对游戏即将更新的内容（无人岛开拓等）表示期待。"},{"id":"215463AF1C","text":"B可能有工作或正在找工作（A1说「お互いいい仕事に恵まれますように」暗示双方都在求职或期望好工作环境）。B目前可能在休息/休假中（A1说「神様が与えてくれた休暇だと思って、ゆっくりなさって下さいね」）。B偶尔会有不想见人的日子。"},{"id":"9F807FDF2E","text":"B吃了冰淇淋（アイス），是在午饭后享用的，B对此感到享受（A1评价为「大人だから出来る贅沢」「至福の時」）。B是成年人。B可能也看YouTube视频（A1向B推荐了YouTuber内容）。"},{"id":"C32E9D588D","text":"B曾就偶像PV（音乐录影带）的内容发表看法，认为其中舞蹈场景和面部特写/唇部特写较多，A1确认了B的说法。B还就染发话题发表了看法（提到黑发清纯的美少女突然染发也会让人心动），A1在此基础上补充了相反观点。"},{"id":"7233C2B8C5","text":"B处于20多岁。"},{"id":"608B09B18A","text":"B已经辞去了销售岗位的工作。"},{"id":"D4C4114C53","text":"B正在学习设计，希望转向新的工作或职业道路；A曾对其表示支持和鼓励。"},{"id":"880D332E43","text":"B出身于日本关西地区。"},{"id":"094C140A18","text":"B已故的父亲曾悉心培育一棵树；B对这棵树结出的果实留有记忆。"},{"id":"7AB58117EB","text":"B在室内培育多种植物，包括橡胶树和橄榄树。"},{"id":"98F47475E2","text":"B与交往六年的伴侣已经分手；A推测或确认，对方不愿意结婚。"},{"id":"F18A9BE4A3","text":"A曾确认B目前并非独自居住；但此信息可能存在对话主体归属的不确定性。"},{"id":"5CC4678F20","text":"B表示自己喜欢作家筒井康隆。"},{"id":"E2324828D9","text":"B曾向A推荐书籍，阅读面较广；A甚至有多本B推荐的书尚未阅读。"},{"id":"05411D4FCB","text":"B看动画，并提到《攻壳机动队》《无罪》（Innocence）和《大都会》等作品。"},{"id":"BBAE27C6AD","text":"B曾向A发送自己做的菜的照片，会做麻婆豆腐、绿咖喱等菜肴。"},{"id":"96B0F4D7B2","text":"A推测或确认B注重饮食营养与均衡。"},{"id":"A059FB3B0D","text":"B曾遇到椿象（カメムシ，俗称臭大姐）停在脖子上的事情。"},{"id":"D5CB67BAB1","text":"B小时候曾到山里捕捉独角仙，并将其带回饲养。"},{"id":"6E1E0F1DF8","text":"B已经许多年没有在家里见到蟑螂。"},{"id":"9BB0207193","text":"A曾确认B过去有过异地恋经历。"},{"id":"D459F53A3C","text":"B在大约十年前短暂尝试过某件事（可能是直播或视频制作），但没有取得明显发展。"},{"id":"4F27D1B956","text":"A的用户名或昵称中包含“sakai”；这里可能存在把A的信息误归给B的情况。"},{"id":"BA9132B56F","text":"画像称B居住在长野县，并称此事在与A1的对话中得到确认。"},{"id":"120FF8B0FE","text":"B在玩网络游戏《最终幻想14》（FINAL FANTASY XIV），期待下个月上线的“无人岛开拓”等新内容。"},{"id":"7397ACAB3D","text":"画像称B有残障情况，求职时难以找到能够提供相应照顾的企业，也没有找到完全远程的工作；目前因病在家疗养。这些属于由A的回应间接推断的信息。"},{"id":"0746A8493C","text":"B正在学习3D建模，已开始销售面向VR用途的改装贴图。"},{"id":"986C5E744E","text":"B喜欢偶像；比起故事情节型MV，B更常看到舞蹈镜头及面部、嘴部特写较多的MV。"},{"id":"9B28E4B67B","text":"B曾染过一次头发，但因后续维护麻烦而不再染发。"},{"id":"8D7000C392","text":"B偶尔观看YouTube频道，例如“メロガッパ”和“リロ氏のひとり遊びチャンネル”。"},{"id":"740DA76FF5","text":"B在关东地区有许多朋友，很想在相隔约五年后再次与朋友聚会（原描述提及疫情前）。"},{"id":"7AEFA5424B","text":"B没有去过冲绳，希望品尝当地正宗的苦瓜炒豆腐（ゴーヤチャンプルー）。"},{"id":"BCA092775C","text":"在与A2的对话中，B正在某地停留；A觉得该地比自己的家乡更令人放松，地点可能是东京。"},{"id":"8F0BBC8CEB","text":"B与A2聊天时，A2有时是一边工作一边回复；A2会在不忙的日子与B交流。这段描述主要涉及A2的情况。"}];

function calculate(){

  const ids=ITEMS.filter(i=>map[i.id].system===kind).map(x=>x.id);

  const perP={};SELF.forEach(s=>perP[s.id]=0);

   const a=normalized(state.answers[id]);
   a.hits.forEach(fid=>{strongest[fid]=Math.max(strongest[fid]||0,a.hitLevels[fid]??5);});

   if(a.penalty>0&&a.topics.length){const share=a.penalty/a.topics.length;for(const p of a.topics)perP[p]=Math.max(perP[p],share);}
  }

   const fs=FACTS.filter(x=>x.pid===s.id);
   const score=fs.reduce((sum,p)=>sum+p.weight*(strongest[p.id]||0)/5,0);
   return {id:s.id,score,total:10,deduction:perP[s.id]};
  });

  result[kind]={items:ids.length,pointCount:Object.keys(strongest).length,coverage,rawPenalty,deduction,final:Math.max(0,coverage-deduction),groups,perP,pointScores};
 }

}
function fmt(x){return (Math.round(x*100)/100).toFixed(2).replace(/\.00$/,'');}
function renderResult(){$('reviewControls').innerHTML='';$('portraitStep').textContent='已提交';$('portraitCode').textContent='评分结果已揭示';$('portraitLeft').textContent=`全部 ${ITEMS.length} 条画像已审核并正式提交。加权评分结果显示在左侧。`;$('pageTitle').textContent='审核结果（提交后揭盲）';$('position').textContent=`提交于 ${new Date(state.submitted_at).toLocaleString('zh-CN')}`;const r=calculate();const w=r.summary.final>r.direct.final?'Summary':r.direct.final>r.summary.final?'Direct':'两组相同';const gap=Math.abs(r.summary.final-r.direct.final);let html=`<div class="callout">这份成绩仅在提交后展示。事实点按各条画像的最高命中程度加权（1–5 对应 20%–100%），每个事实点只计一次；同一自述的重复矛盾扣分取最高值。<strong>当前结果：${esc(w)}${w==='两组相同'?'':` 领先 ${fmt(gap)} 分`}</strong>。</div><div class="resultgrid">${['summary','direct'].map(k=>`<div class="stat"><div class="caps">${k==='summary'?'SUMMARY':'DIRECT'}</div><div class="value">${fmt(r[k].final)} <span class="dim">/ 100</span></div><p>加权事实覆盖 ${fmt(r[k].coverage)} 分</p><p>矛盾扣分 −${fmt(r[k].deduction)} 分</p><p>唯一命中 ${r[k].pointCount} / ${FACTS.length} 点（取最高等级） · ${r[k].items} 条画像</p></div>`).join('')}</div><h3>按 10 条自述分项统计</h3><div class="tablebox"><table><thead><tr><th>B 自述</th><th>Summary 覆盖</th><th>Direct 覆盖</th><th>Summary 矛盾扣分</th><th>Direct 矛盾扣分</th></tr></thead><tbody>${SELF.map(s=>{const a=r.summary.groups.find(x=>x.id===s.id),b=r.direct.groups.find(x=>x.id===s.id);return `<tr><td>${s.id}</td><td class="num">${fmt(a.score)} / 10</td><td class="num">${fmt(b.score)} / 10</td><td class="num">${fmt(a.deduction)}</td><td class="num">${fmt(b.deduction)}</td></tr>`;}).join('')}</tbody></table></div><details><summary>查看命中事实点与原始条目的算法来源</summary>${['summary','direct'].map(k=>{const map=sourceKey();const ids=ITEMS.filter(x=>map[x.id].system===k);const hit=new Set();ids.forEach(it=>(state.answers[it.id]?.hits||[]).forEach(p=>hit.add(p)));return `<h3>${k}：${ids.length} 条</h3><p>唯一覆盖（最高等级与加权得分）：${r[k].pointScores.filter(x=>x.bestLevel>0).map(x=>esc(x.id+' '+byPoint[x.id].label+' · '+x.bestLevel+'/5 · '+fmt(x.score)+'/'+x.weight+'分')).join('；')||'无'}</p><p class="help">条目映射：${ids.map(x=>esc(map[x.id].row+' / '+x.id)).join('；')}</p>`;}).join('')}</details><div class="actions"><button id="downloadResult">导出完整评分 JSON</button><button id="downloadCsv">导出分项 CSV</button><button id="undo">撤回提交，继续编辑</button></div><div class="callout"><strong>计分说明：</strong>每个事实点的分数＝权重 ×（最佳命中等级 / 5）；同一算法重复命中仅取最高等级，总覆盖分满分 100。矛盾每条选 0–5 分，若涉及多条自述则等分；同组同一自述的矛盾只保留最大扣分。最终分 = max(0,覆盖分 − 去重后的矛盾扣分)。B 未提及的画像信息不自动记为矛盾。</div>`;
 $('content').innerHTML=html;$('downloadResult').onclick=()=>exportData(true);$('downloadCsv').onclick=exportCsv;$('undo').onclick=()=>{if(confirm('撤回提交会隐藏成绩并允许编辑，已填答案不会丢失。是否继续？')){state.submitted_at=null;save();goto(0);}};}
function payload(withScores){const o={schema:SCHEMA,reviewer:state.reviewer||'anonymous',exported_at:new Date().toISOString(),created_at:state.created_at,index:state.index,submitted_at:state.submitted_at,reviewed:reviewed(),total:ITEMS.length,order:state.order,responses:state.order.map(id=>({item_id:id,...normalized(state.answers[id])}))};if(withScores&&state.submitted_at){o.scoring_method='sum over unique gold facts: weight * max hit level(1..5)/5, then subtract max contradiction by self-statement (0..5 per row, divided between selected statements)';o.results=calculate();}return o;}
function download(name,str,type='application/json;charset=utf-8'){const blob=new Blob([str],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportData(withScores){state.reviewer=$('reviewer').value.trim();save();const s=payload(withScores);download(`portrait_review_v5_${(state.reviewer||'anonymous').replace(/[^a-zA-Z0-9_-]/g,'_')}.json`,JSON.stringify(s,null,2));}
function exportCsv(){const r=calculate(),rows=[['自述','Summary加权覆盖','Direct加权覆盖','Summary矛盾扣分','Direct矛盾扣分']];SELF.forEach((s,i)=>rows.push([s.id,r.summary.groups[i].score,r.direct.groups[i].score,r.summary.groups[i].deduction,r.direct.groups[i].deduction]));rows.push(['总覆盖',r.summary.coverage,r.direct.coverage,'','']);rows.push(['总矛盾扣分','','',r.summary.deduction,r.direct.deduction]);rows.push(['最终得分',r.summary.final,r.direct.final,'','']);download('portrait_review_v5_1_score.csv','\ufeff'+rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function loadProgress(text){
 let d;
 try{d=JSON.parse(text);}catch(e){alert('文件不是有效 JSON');return;}
 if(!validImport(d)){alert('不是本次新 B 的兼容进度文件，请勿导入旧 B 审核记录');return;}
 if(!confirm('导入记录将覆盖本页面当前答案。确定继续吗？'))return;
 const next={schema:SCHEMA,reviewer:String(d.reviewer||''),index:0,order:[...d.order],answers:{},submitted_at:null,created_at:String(d.created_at||new Date().toISOString())};
 const rows=Array.isArray(d.responses)?d.responses:Object.entries(d.answers||{}).map(([item_id,a])=>({item_id,...a}));
 for(const a of rows)if(Object.hasOwn(byId,a.item_id))next.answers[a.item_id]=normalized(a);
 // 保留原审核位置。旧版导出的 JSON 没有 index 时，自动定位第一个未完成的条目。
 const firstIncomplete=next.order.findIndex(id=>!good(next.answers[id]));
 next.index=Number.isInteger(d.index)&&d.index>=0&&d.index<=ITEMS.length?d.index:(firstIncomplete<0?ITEMS.length:firstIncomplete);
 // 只允许已完成 55 条的文件恢复“已提交”状态，防止有缺项时提前展示成绩。
 const allDone=next.order.every(id=>good(next.answers[id]));
 if(d.submitted_at&&allDone){next.submitted_at=String(d.submitted_at);next.index=ITEMS.length;}
 state=next;save();render();
}
$('reviewer').oninput=e=>{state.reviewer=e.target.value;save();};$('jump').onchange=e=>{if(!state.submitted_at)goto(Number(e.target.value));};$('saveDraft').onclick=()=>exportData(!!state.submitted_at);$('loadDraft').onclick=()=>$('draftFile').click();$('draftFile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(loadProgress);e.target.value='';};$('restart').onclick=()=>{if(!confirm('清空全部答案，生成新的随机顺序？此操作不可撤销。'))return;state=fresh();save();render();};
save();render();
</script></body></html>
